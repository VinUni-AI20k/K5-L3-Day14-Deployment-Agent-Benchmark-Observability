# ============================================================
# Cấu hình deploy Render (Blueprint) — gói miễn phí (tiêu chí 12)
#   • web service: build từ Dockerfile, health check /health
#   • redis: key-value free, chỉ truy cập nội bộ từ agent
#   • AGENT_API_KEY được Render tự sinh (generateValue), KHÔNG ghi giá trị vào file
# Đường dẫn trong file tính từ gốc repo, vì repo có thư mục 06-lab-complete/.
# ============================================================
services:
  - type: web
    name: k5-day14-agent
    runtime: docker
    plan: free
    dockerContext: ./06-lab-complete
    dockerfilePath: ./06-lab-complete/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: AGENT_API_KEY
        generateValue: true
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: agent-redis
          property: connectionString
      - key: RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: DAILY_BUDGET_USD
        value: "1.0"

  - type: keyvalue
    name: agent-redis
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList: []
