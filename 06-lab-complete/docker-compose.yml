# ============================================================
# Docker Compose — agent + redis (tiêu chí 2)
# Chạy:  docker compose up --build
# ============================================================
services:
  agent:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false       # không có .env vẫn chạy được
    environment:
      REDIS_URL: redis://redis:6379/0   # override REDIS_URL trong .env (nếu có)
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
